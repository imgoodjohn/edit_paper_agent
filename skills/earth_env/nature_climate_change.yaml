journal:
  name: "Nature Climate Change"
  abbreviation: "Nat. Clim. Change"
  publisher: "Springer Nature"
  url: "https://www.nature.com/nclimate/for-authors"
  issn: "1758-678X"
  impact_factor: 29.6
  open_access: false
  discipline: ["climate_science", "climate_policy", "earth_science", "environmental_science", "economics", "social_science"]
  last_verified: "2025-01-01"

scope:
  description: >
    Dedicated to publishing the most significant research on the physical and
    social science of climate change, its consequences, and the options for
    mitigation and adaptation. Highly interdisciplinary covering natural and
    social sciences. Strong policy relevance expected.
  keywords:
    - "climate change"
    - "global warming"
    - "climate policy"
    - "carbon emissions"
    - "climate impacts"
    - "adaptation"
    - "mitigation"
    - "tipping points"
    - "climate modeling"
    - "socioeconomic impacts"

article_types:
  - type: "Article"
    word_limit: 3500
    word_limit_scope: "main text"
    abstract_limit: 150
    abstract_type: "unstructured"
    abstract_sections: []
    figures_max: 6
    tables_max: null
    references_max: 60
    pages_max: null

  - type: "Letter"
    word_limit: 1500
    word_limit_scope: "main text"
    abstract_limit: 150
    abstract_type: "unstructured"
    abstract_sections: []
    figures_max: 4
    tables_max: null
    references_max: 30
    pages_max: null

  - type: "Review"
    word_limit: 5000
    word_limit_scope: "main text"
    abstract_limit: 200
    abstract_type: "unstructured"
    abstract_sections: []
    figures_max: 8
    tables_max: null
    references_max: 150
    pages_max: null
    notes: "Usually invited"

  - type: "Perspective"
    word_limit: 2000
    word_limit_scope: "main text"
    abstract_limit: null
    abstract_type: "none"
    abstract_sections: []
    figures_max: 2
    tables_max: null
    references_max: 40
    pages_max: null

format:
  template: "nature_style"
  latex_template_url: null
  word_template_url: "https://www.nature.com/nclimate/for-authors"
  font: null
  font_size: null
  spacing: "double"
  columns: 1
  reference_style: "numbered"
  reference_format: "Nature"
  keywords_required: false
  keywords_count: null

sections:
  required: ["Abstract", "Introduction", "Results", "Discussion", "Methods"]
  optional: ["Extended Data", "Supplementary Information"]
  order: ["Abstract", "Introduction", "Results", "Discussion", "Methods"]

figures:
  min_resolution_dpi: 300
  preferred_formats: ["EPS", "AI", "TIFF"]
  color_policy: "free"
  graphical_abstract: false

checklist:
  declarations_required:
    - "Competing interests"
    - "Author contributions"
    - "Data availability"
    - "Code availability"
  ethics_statement: false
  clinical_trial_registration: false
  orcid_required: true
  cover_letter: "optional"
  ai_use_disclosure: true
  data_availability: true
  reporting_guidelines: []
  additional:
    - "Climate model code and configurations must be shared"
    - "CMIP model outputs: link to ESGF repository"
    - "Economic/IAM model parameters must be available"
    - "Social science data: anonymized and deposited"
    - "Policy implications should be discussed"

submission:
  system: "custom"
  url: "https://mts-nclimate.nature.com"
  preprint_policy: "accepted"
  double_blind: false
  review_type: "single_blind"

agents:
  structure_rules:
    - "Abstract ≤150 words"
    - "Articles: main text ≤3500 words"
    - "Maximum 6 figures"
    - "Methods required"
  content_rules:
    - "Highly significant research on climate science OR policy OR impacts"
    - "Interdisciplinary work spanning natural and social sciences valued"
    - "Policy implications must be clearly articulated"
    - "Uncertainty quantification required for projections"
  compliance_rules:
    - "Model code and configurations must be publicly available"
    - "Data in field-appropriate repositories"
    - "Competing interests: disclose any energy-industry funding"
    - "ORCID required"
  language_rules:
    - "Policy-relevant framing in Abstract and Discussion"
    - "Uncertainty ranges reported for all quantitative findings"
    - "Accessible to interdisciplinary audience (natural + social scientists)"
