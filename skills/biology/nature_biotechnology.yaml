journal:
  name: "Nature Biotechnology"
  abbreviation: "Nat. Biotechnol."
  publisher: "Springer Nature"
  url: "https://www.nature.com/nbt/for-authors"
  issn: "1087-0156"
  impact_factor: 33.1
  open_access: false
  discipline: ["biotechnology", "synthetic_biology", "genomics", "biopharmaceuticals", "bioengineering", "agriculture"]
  last_verified: "2025-01-01"

scope:
  description: >
    Covers research, methods, and applications at the intersection of life sciences
    and engineering. Encompasses healthcare biotechnology (therapeutics, diagnostics),
    agricultural biotechnology, industrial biotechnology, and platform technologies.
    High bar for novelty, technical rigor, and translational potential.
  keywords:
    - "CRISPR"
    - "gene therapy"
    - "synthetic biology"
    - "protein engineering"
    - "biopharmaceuticals"
    - "single-cell"
    - "CAR-T"
    - "mRNA therapeutics"
    - "biosensors"
    - "agricultural biotech"

article_types:
  - type: "Article"
    word_limit: 4000
    word_limit_scope: "main text"
    abstract_limit: 150
    abstract_type: "unstructured"
    abstract_sections: []
    figures_max: 6
    tables_max: null
    references_max: 50
    pages_max: null

  - type: "Brief Communication"
    word_limit: 2000
    word_limit_scope: "main text"
    abstract_limit: 100
    abstract_type: "unstructured"
    abstract_sections: []
    figures_max: 3
    tables_max: null
    references_max: 20
    pages_max: null

  - type: "Perspective"
    word_limit: 3000
    word_limit_scope: "main text"
    abstract_limit: null
    abstract_type: "none"
    abstract_sections: []
    figures_max: 3
    tables_max: null
    references_max: 50
    pages_max: null
    notes: "Usually invited; discusses emerging technologies or industry perspectives"

format:
  template: "nature_style"
  latex_template_url: null
  word_template_url: "https://www.nature.com/nbt/for-authors"
  font: null
  font_size: null
  spacing: "double"
  columns: 1
  reference_style: "numbered"
  reference_format: "Nature"
  keywords_required: false
  keywords_count: null

sections:
  required: ["Abstract", "Introduction", "Results", "Discussion", "Methods"]
  optional: ["Extended Data", "Supplementary Information"]
  order: ["Abstract", "Introduction", "Results", "Discussion", "Methods"]

figures:
  min_resolution_dpi: 300
  preferred_formats: ["EPS", "AI", "TIFF"]
  color_policy: "free"
  graphical_abstract: false

checklist:
  declarations_required:
    - "Competing interests"
    - "Author contributions"
    - "Data availability"
    - "Code availability"
  ethics_statement: true
  clinical_trial_registration: false
  orcid_required: true
  cover_letter: "required"
  ai_use_disclosure: true
  data_availability: true
  reporting_guidelines: ["ARRIVE", "CONSORT"]
  additional:
    - "Life Sciences Reporting Summary required"
    - "Sequence data deposited (GenBank/GEO/SRA)"
    - "Protein structures deposited (PDB)"
    - "All custom code available"

submission:
  system: "custom"
  url: "https://mts-nbt.nature.com"
  preprint_policy: "accepted"
  double_blind: false
  review_type: "single_blind"

agents:
  structure_rules:
    - "Abstract ≤150 words"
    - "Articles: ≤4000 words main text"
    - "Maximum 6 display items"
  content_rules:
    - "Clear biotechnology application or platform demonstrated"
    - "Translational potential clearly articulated"
    - "Technical performance validated rigorously"
    - "In vivo validation expected for therapeutic claims"
  compliance_rules:
    - "Life Sciences Reporting Summary required"
    - "Sequence data deposited with accession numbers"
    - "Code deposited publicly"
    - "Competing interests especially important (patent/commercial interests)"
  language_rules:
    - "Emphasize practical applications and translational potential"
    - "Technical specifications clearly stated"
